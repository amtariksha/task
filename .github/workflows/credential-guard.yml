name: Credential guard

# Fails when a database credential is committed. The test reports file:line only, never the value.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: No database credentials in tracked files
        run: node --test apps/web/src/lib/__tests__/no-committed-db-credentials.test.mjs
